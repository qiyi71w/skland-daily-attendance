name: attendance

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      SKLAND_TOKENS:
        required: true
      SKLAND_NOTIFICATION_URLS:
        required: false
      SKLAND_ANONYMOUS:
        required: false
      MAX_RETRIES:
        required: false
      KUMA_PUSH_URL:
        required: true
    inputs:
      repository:
        description: The repository to run the workflow on
        default: enpitsuLin/skland-daily-attendance
        required: false
        type: string

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install

      - name: Run daily attendance
        run: pnpm action
        env:
          SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
          SKLAND_NOTIFICATION_URLS: ${{ secrets.SKLAND_NOTIFICATION_URLS }}
          SKLAND_MAX_RETRIES: ${{ secrets.MAX_RETRIES }}
          SKLAND_ANONYMOUS: ${{ secrets.SKLAND_ANONYMOUS }}

      - name: Report result to Uptime Kuma
        if: ${{ always() }}
        env:
          KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$KUMA_PUSH_URL" ]; then
            echo "::error::KUMA_PUSH_URL is not configured"
            exit 1
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            status="up"
          else
            status="down"
          fi

          response=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$response" "$headers"' EXIT

          code=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --dump-header "$headers" \
            --output "$response" \
            --write-out '%{http_code}' \
            --get "${KUMA_PUSH_URL%%\?*}" \
            --data-urlencode "status=$status" \
            --data-urlencode "msg=attendance: $JOB_STATUS")

          if [ "$code" != "200" ]; then
            python3 - "$headers" "$code" <<'PY'
          import os, sys
          from urllib.parse import urljoin, urlsplit
          source = urlsplit(os.environ['KUMA_PUSH_URL'])
          print(f"::error::Kuma returned HTTP {sys.argv[2]}; source host: {source.hostname}")
          with open(sys.argv[1]) as headers:
              for line in headers:
                  if line.lower().startswith('location:'):
                      target = urlsplit(urljoin(os.environ['KUMA_PUSH_URL'], line.split(':', 1)[1].strip()))
                      print(f"Redirect target host: {target.hostname}; scheme: {target.scheme}")
          PY
            exit 1
          fi

          if ! jq -e 'type == "object" and .ok == true' "$response" >/dev/null 2>&1; then
            echo '::error::Kuma did not acknowledge the heartbeat with {"ok":true}'
            exit 1
          fi
          echo 'Kuma acknowledged heartbeat: {"ok":true}'
